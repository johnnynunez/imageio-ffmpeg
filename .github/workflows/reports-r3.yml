name: imageio r3 strict historical reports hygiene
on:
  push:
    branches: [ci/imageio-package-r3-20261012]
    paths: ['.ci-native/reports*', '.ci-native/test_reports_policy.py', '.ci-native/hygiene_ci.py', '.github/workflows/reports-r3.yml']
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  hygiene:
    runs-on: windows-11-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install pinned pytest for cheap cache-policy probe
        run: python -B -m pip install pytest==9.1.1
      - name: Reject historical bytecode and stage explicit text allowlist
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B .ci-native/hygiene_ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: imageio-r3-sanitized-r2-reports
          path: ${{ runner.temp }}/upload-r2
          if-no-files-found: error
          retention-days: 14
